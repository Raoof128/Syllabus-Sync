name: Push Reminders Cron

# SECURITY/RELIABILITY (BA-0016): this workflow used to run on a `schedule`
# trigger firing every 10 minutes, in addition to /api/cron/push-reminders
# being invoked through Cloudflare. It was never folded into the
# 2026-07-29 Vercel->Cloudflare cron cutover (wrangler.jsonc only
# reconciled the three routes in lib/cloudflare/scheduled.ts's
# CRON_ROUTE_BY_EXPRESSION). On this repo PUSH_REMINDERS_CRON_URL/SECRET
# are unset, so the job's own guard below already refuses to curl anything
# - but it still ran (and failed) every 10 minutes as CI noise, and the
# moment those secrets are populated it becomes a real duplicate scheduler.
# The schedule trigger is removed; workflow_dispatch is kept so this can
# still be run by hand if ever needed.
on:
  workflow_dispatch:

jobs:
  push-reminders:
    name: Trigger push reminders endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Call push reminders cron endpoint
        env:
          PUSH_REMINDERS_CRON_URL: ${{ secrets.PUSH_REMINDERS_CRON_URL }}
          PUSH_REMINDERS_CRON_SECRET: ${{ secrets.PUSH_REMINDERS_CRON_SECRET }}
        run: |
          if [ -z "$PUSH_REMINDERS_CRON_URL" ] || [ -z "$PUSH_REMINDERS_CRON_SECRET" ]; then
            echo "Missing required secrets: PUSH_REMINDERS_CRON_URL and/or PUSH_REMINDERS_CRON_SECRET"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $PUSH_REMINDERS_CRON_SECRET" \
            "$PUSH_REMINDERS_CRON_URL" | cat
