name: Deploy Cloudflare Worker

# Manual only. Production additionally requires the `cloudflare-production`
# GitHub Environment to have owner approval configured as a protection rule.
# Attaching the production custom domain remains a separate operator action.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'cloudflare-production' || 'cloudflare-preview' }}

    env:
      DEPLOYMENT_PLATFORM: cloudflare
      DEPLOYMENT_ENV: ${{ inputs.target }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAP_ID }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require main for production
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployment is allowed only from main."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BA-0058: the job-level `env:` block above is in scope for EVERY step,
      # including this one, so the unit tests ran with deployment configuration
      # visible. Six assertions across four files then failed in CI while passing
      # locally, and because this gate runs before the deploy steps, the P0
      # WebAuthn fix in 1073e4da could not ship for three days:
      #
      #   emailService  - asserts the VERCEL_URL fallback "when NEXT_PUBLIC_APP_URL
      #                   is not set"; the job env sets it, so the premise is void
      #   rateLimitService / protected-route-auth
      #                 - DEPLOYMENT_ENV=production makes the limiter fail closed
      #                   ("no distributed rate limiting in production"), turning
      #                   an expected 200 into a 403
      #   security/ip   - DEPLOYMENT_PLATFORM=cloudflare changes which forwarded
      #                   header getClientIP trusts
      #
      # The tests are right; the environment was wrong. Unit tests must not see
      # deployment configuration.
      #
      # These four are blanked here rather than moving the whole job-level block
      # onto the build and deploy steps. That alternative is the tidier shape but
      # a far riskier edit: `NEXT_PUBLIC_*` values are inlined at BUILD time, and
      # omitting one while relocating the block is precisely what caused the
      # 2026-07-30 production outage (see tools/cloudflare/check-public-env.mjs).
      # Nothing the build or deploy consumes is touched by this change.
      #
      # Verified locally: with these four set, 6 tests across 4 files fail —
      # exactly the CI failures. With them blank, 1267/1267 pass.
      - name: Run quality gate
        env:
          DEPLOYMENT_PLATFORM: ''
          DEPLOYMENT_ENV: ''
          NEXT_PUBLIC_APP_URL: ''
          NEXT_PUBLIC_SITE_URL: ''
        run: npm run check

      - name: Validate deployment environment
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
        run: npm run deploy:env:check

      # Builds, records Sharp reachability for this exact build, enforces the
      # reachability gate, then measures the compressed upload before deploying.
      - name: Dry-run and size-gate the Worker
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "$DEPLOYMENT_ENV" = "production" ]; then
            npm run cf:dry-run:production
            npm run check:worker-size -- .open-next/wrangler-production-dry-run.log
          else
            npm run cf:dry-run
            npm run check:worker-size -- .open-next/wrangler-dry-run.log
          fi

      - name: Deploy preview Worker
        if: inputs.target == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run cf:deploy

      - name: Deploy production Worker
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run cf:deploy:production

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-diagnostics-${{ inputs.target }}
          path: |
            .open-next/wrangler-dry-run.log
            .open-next/wrangler-production-dry-run.log
            artifacts/security/sharp-worker-reachability.json
            artifacts/security/sharp-worker-reachability.production.json
          if-no-files-found: ignore
