name: Pull Request Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: npm audit --omit=dev --audit-level high

      - name: Scan for committed secrets
        run: npm run check:secrets

      - name: Validate translation fallback gaps
        run: npm run check:i18n

      - name: Check local documentation links
        run: node tools/docs/check-local-links.mjs

  validate:
    name: Format, lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

  migrations:
    name: Fresh Database Build
    runs-on: ubuntu-latest

    # BA-0053: no pass of this project had ever replayed the migration set
    # against an empty database. Doing so on 2026-08-02 found 6 of 78
    # migrations fatally broken, which meant there was no reproducible path to
    # a new environment and therefore no tested recovery path.
    #
    # tools/database/verify-fresh-build.sh was written that day and its header
    # says "This script exists so that can never again be true without CI
    # saying so." Nothing called it. The 2026-08-02 audit report went on to
    # state the fix was "gated in CI", which the external reviewer would have
    # taken at face value. This job is what makes that sentence true, added
    # 2026-08-17 while answering their Q2.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Build a database from supabase/migrations/ alone
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tools/database/verify-fresh-build.sh

  build:
    name: Next.js and Cloudflare build
    runs-on: ubuntu-latest
    needs:
      - security
      - validate
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BPlaceholder
      CF_EXPECT_PUBLIC_URL: '1'

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Build Cloudflare/OpenNext bundle
        run: npm run cf:build

      - name: Verify Cloudflare/OpenNext output
        run: npm run cf:verify-output

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - security
      - validate
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
